basePath: /
definitions:
  handler.MaxIDResp:
    properties:
      id:
        type: integer
    type: object
  stream.AddEventReq:
    properties:
      address:
        type: string
      block_number:
        type: string
      chain_id:
        type: integer
      format:
        type: string
      project_id:
        type: integer
    required:
    - address
    - format
    type: object
  stream.AddProjectReq:
    properties:
      desc:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  stream.ChainEventStatistics:
    properties:
      chain_id:
        type: string
      message_in:
        type: integer
      message_out:
        type: integer
    type: object
  stream.CommonResp:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  stream.DailyEventStatistics:
    properties:
      chains:
        items:
          $ref: '#/definitions/stream.ChainEventStatistics'
        type: array
      date:
        type: string
      updated_at:
        type: integer
    type: object
  stream.DelEventReq:
    properties:
      id:
        type: integer
    required:
    - id
    type: object
  stream.EventListResp:
    properties:
      limit:
        type: integer
      list:
        items:
          $ref: '#/definitions/stream.GetEventResp'
        type: array
      page:
        type: integer
      total:
        type: integer
    type: object
  stream.EventStatisticsResp:
    properties:
      days:
        items:
          $ref: '#/definitions/stream.DailyEventStatistics'
        type: array
      end_date:
        type: string
      start_date:
        type: string
      timezone:
        type: string
      updated_at:
        type: integer
    type: object
  stream.GetEventReq:
    properties:
      format:
        type: string
      id:
        type: integer
      project_id:
        type: integer
      topic:
        type: string
    type: object
  stream.GetEventResp:
    properties:
      created:
        type: integer
      format:
        type: string
      id:
        type: integer
      project_id:
        type: integer
      topic:
        type: string
    type: object
  stream.GetMosResp:
    properties:
      block_hash:
        type: string
      block_number:
        type: integer
      chain_id:
        type: integer
      contract_address:
        type: string
      event_id:
        type: integer
      id:
        type: integer
      log_data:
        type: string
      log_index:
        type: integer
      project_id:
        type: integer
      topic:
        type: string
      tx_hash:
        type: string
      tx_index:
        type: integer
      tx_timestamp:
        type: integer
    type: object
  stream.GetProjectReq:
    properties:
      id:
        type: integer
      name:
        type: string
    required:
    - name
    type: object
  stream.GetProjectResp:
    properties:
      created:
        type: integer
      desc:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  stream.ListeningEvent:
    properties:
      address:
        type: string
      block_number:
        type: string
      created:
        type: integer
      format:
        type: string
      id:
        type: integer
      project_id:
        type: integer
      topic:
        type: string
    type: object
  stream.ListeningEventsResp:
    properties:
      chain_id:
        type: string
      list:
        items:
          $ref: '#/definitions/stream.ListeningEvent'
        type: array
      total:
        type: integer
    type: object
  stream.MosListResp:
    properties:
      list:
        items:
          $ref: '#/definitions/stream.GetMosResp'
        type: array
      total:
        type: integer
    type: object
info:
  contact: {}
  description: |-
    跨链事件过滤服务 radar 的 HTTP 接口。
    /v1 下的接口需要认证：请求来源 IP 在 ip_whitelist 中，或带 X-API-Key / Authorization: Bearer 头。
    业务失败也返回 HTTP 200，以响应体里的 code 为准（200 成功）。
  title: MAP Protocol Radar API
  version: "1.0"
paths:
  /v1/block:
    get:
      description: filter 主实例约每 3 秒写一次，data 为十进制字符串
      parameters:
      - description: 链 id（必填，非 0）
        in: query
        name: chain_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: code=200 成功，其他 code 为失败
          schema:
            allOf:
            - $ref: '#/definitions/stream.CommonResp'
            - properties:
                data:
                  type: string
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/stream.CommonResp'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: 链上最新高度
      tags:
      - block
  /v1/block/scan:
    get:
      description: filter 主实例约每 3 秒写一次已扫描到的高度，data 为十进制字符串
      parameters:
      - description: 链 id（必填，非 0）
        in: query
        name: chain_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: code=200 成功，其他 code 为失败
          schema:
            allOf:
            - $ref: '#/definitions/stream.CommonResp'
            - properties:
                data:
                  type: string
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/stream.CommonResp'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: 扫描进度
      tags:
      - block
  /v1/event:
    delete:
      consumes:
      - application/json
      parameters:
      - description: id 必填
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/stream.DelEventReq'
      produces:
      - application/json
      responses:
        "200":
          description: code=200 成功，其他 code 为失败
          schema:
            $ref: '#/definitions/stream.CommonResp'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/stream.CommonResp'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: 删除事件
      tags:
      - event
    get:
      consumes:
      - application/json
      description: 注意：参数从 JSON body 读取（GET 带 body），Swagger UI 和浏览器无法发送，请用 curl -X
        GET -d
      parameters:
      - description: 按 id / project_id / format / topic 过滤
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/stream.GetEventReq'
      produces:
      - application/json
      responses:
        "200":
          description: code=200 成功，其他 code 为失败
          schema:
            allOf:
            - $ref: '#/definitions/stream.CommonResp'
            - properties:
                data:
                  $ref: '#/definitions/stream.GetEventResp'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/stream.CommonResp'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: 查询事件
      tags:
      - event
    post:
      consumes:
      - application/json
      description: |-
        format 为事件签名（如 MessageOut(bytes32,uint256,bytes)），topic 由服务端计算；
        不传 chain_id 表示所有链都监听；指定 block_number 时必须同时指定 chain_id
      parameters:
      - description: project_id、format、address 必填
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/stream.AddEventReq'
      produces:
      - application/json
      responses:
        "200":
          description: code=200 成功，其他 code 为失败
          schema:
            $ref: '#/definitions/stream.CommonResp'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/stream.CommonResp'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: 注册事件
      tags:
      - event
  /v1/event/list:
    get:
      parameters:
      - description: 事件 id（必填，非 0）
        in: query
        name: id
        required: true
        type: integer
      - description: 项目 id
        in: query
        name: project_id
        type: integer
      - description: 事件签名
        in: query
        name: format
        type: string
      - description: 事件 topic
        in: query
        name: topic
        type: string
      - description: 偏移
        in: query
        name: offset
        type: integer
      - description: 条数
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: code=200 成功，其他 code 为失败
          schema:
            allOf:
            - $ref: '#/definitions/stream.CommonResp'
            - properties:
                data:
                  $ref: '#/definitions/stream.EventListResp'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/stream.CommonResp'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: 事件列表
      tags:
      - event
  /v1/event/listening:
    get:
      description: 返回指定链的事件定义以及不限链的全局定义，跨所有项目，按 id 升序，不分页；详见 API_EVENT_LISTENING.md
      parameters:
      - description: 链 id，单个正整数，默认 1
        in: query
        name: chain_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/stream.CommonResp'
            - properties:
                data:
                  $ref: '#/definitions/stream.ListeningEventsResp'
              type: object
        "400":
          description: chain_id 非法
          schema:
            $ref: '#/definitions/stream.CommonResp'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/stream.CommonResp'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/stream.CommonResp'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: 链上生效的监听事件
      tags:
      - event
  /v1/event/statistics:
    get:
      description: 按天、按链统计 MessageOut / MessageIn 数量；详见 API_EVENT_STATISTICS.md
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/stream.CommonResp'
            - properties:
                data:
                  $ref: '#/definitions/stream.EventStatisticsResp'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/stream.CommonResp'
        "503":
          description: 统计数据尚未就绪
          schema:
            $ref: '#/definitions/stream.CommonResp'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: 每日事件统计
      tags:
      - event
  /v1/mos/block/list:
    get:
      parameters:
      - description: 链 id（必填，非 0）
        in: query
        name: chain_id
        required: true
        type: integer
      - description: 项目 id
        in: query
        name: project_id
        type: integer
      - description: 事件 topic，多个用英文逗号分隔
        in: query
        name: topic
        type: string
      - description: 游标：只返回 id 大于它的记录
        in: query
        name: id
        type: integer
      - description: 区块高度
        in: query
        name: block_number
        type: integer
      - description: 交易 hash
        in: query
        name: tx_hash
        type: string
      - description: 条数，1~100，默认 10
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: code=200 成功，其他 code 为失败
          schema:
            allOf:
            - $ref: '#/definitions/stream.CommonResp'
            - properties:
                data:
                  $ref: '#/definitions/stream.MosListResp'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/stream.CommonResp'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: 按链拉取事件日志
      tags:
      - mos
  /v1/mos/list:
    get:
      description: 按 id 游标增量拉取：返回 id 大于参数 id 的记录，id 不传按 1 处理；limit 不传或大于 100 时按 10
        处理
      parameters:
      - description: 项目 id（必填，非 0）
        in: query
        name: project_id
        required: true
        type: integer
      - description: 链 id
        in: query
        name: chain_id
        type: integer
      - description: 事件 topic，多个用英文逗号分隔
        in: query
        name: topic
        type: string
      - description: 游标：只返回 id 大于它的记录
        in: query
        name: id
        type: integer
      - description: 区块高度
        in: query
        name: block_number
        type: integer
      - description: 交易 hash
        in: query
        name: tx_hash
        type: string
      - description: 条数，1~100，默认 10
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: code=200 成功，其他 code 为失败
          schema:
            allOf:
            - $ref: '#/definitions/stream.CommonResp'
            - properties:
                data:
                  $ref: '#/definitions/stream.MosListResp'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/stream.CommonResp'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: 事件日志列表
      tags:
      - mos
  /v1/mos/max/id:
    get:
      parameters:
      - description: 项目 id（必填，非 0）
        in: query
        name: project_id
        required: true
        type: integer
      - description: 链 id
        in: query
        name: chain_id
        type: integer
      - description: 事件 topic，多个用英文逗号分隔
        in: query
        name: topic
        type: string
      - description: 游标：只返回 id 大于它的记录
        in: query
        name: id
        type: integer
      - description: 区块高度
        in: query
        name: block_number
        type: integer
      - description: 交易 hash
        in: query
        name: tx_hash
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: code=200 成功，其他 code 为失败
          schema:
            allOf:
            - $ref: '#/definitions/stream.CommonResp'
            - properties:
                data:
                  $ref: '#/definitions/handler.MaxIDResp'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/stream.CommonResp'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: 最大日志 id
      tags:
      - mos
  /v1/project:
    get:
      consumes:
      - application/json
      description: 注意：参数从 JSON body 读取（GET 带 body），Swagger UI 和浏览器无法发送，请用 curl -X
        GET -d
      parameters:
      - description: name 必填
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/stream.GetProjectReq'
      produces:
      - application/json
      responses:
        "200":
          description: code=200 成功，其他 code 为失败
          schema:
            allOf:
            - $ref: '#/definitions/stream.CommonResp'
            - properties:
                data:
                  $ref: '#/definitions/stream.GetProjectResp'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/stream.CommonResp'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: 查询项目
      tags:
      - project
    post:
      consumes:
      - application/json
      description: name 为必填；重名等业务失败同样返回 HTTP 200，需看 body 里的 code
      parameters:
      - description: 项目信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/stream.AddProjectReq'
      produces:
      - application/json
      responses:
        "200":
          description: code=200 成功，其他 code 为失败
          schema:
            $ref: '#/definitions/stream.CommonResp'
        "401":
          description: 缺少或错误的 API Key，且不在 IP 白名单
          schema:
            $ref: '#/definitions/stream.CommonResp'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: 创建项目
      tags:
      - project
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: X-API-Key
    type: apiKey
  BearerAuth:
    description: 填 "Bearer <api-key>"
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
